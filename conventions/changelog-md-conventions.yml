note: >-
  There is no API here, so the runtime-semantics dimensions this artifact normally
  measures have no subject. They are recorded as `na` with the reason, not as zero: Keep
  a Changelog is a static, MIT-licensed specification served from GitHub Pages, with —
  in the project's own words — "No backend. The site is static HTML, built once and
  served from GitHub Pages." What this file does capture is the FORMAT's own conventions,
  which are the thing a machine actually parses here.

