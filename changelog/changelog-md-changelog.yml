  - version: 1.1.1
    date: '2023-03-05'
    breaking: false
    highlights:
      - Seven more v1.1 translations (Arabic, French, Dutch, Russian, Japanese, Norwegian Bokmal, Turkish).
      - Pages default to the most recent version available for each language, and the site displays a count of available translations.
      - All links centralized into /data/links.json so they can be updated in one place.
      - Dependencies upgraded to Ruby 3.2.1 and current Middleman.

  - version: 1.1.0
    date: '2019-02-15'
    url: https://keepachangelog.com/en/1.1.0/
    breaking: false
    highlights:
      - Danish and Georgian translations.
      - Changelog-inconsistency section added to Bad Practices.

  - version: 1.0.0
    date: '2017-06-20'
    url: https://keepachangelog.com/en/1.0.0/
    breaking: false
    highlights:
      - New visual identity, version navigation, and links from older versions to the latest release.
      - Added the "Why keep a changelog?", "Who needs a changelog?" and "How do I make a changelog?" sections, plus the Guiding Principles sub-section.
      - First wave of community translations (Chinese, German, Italian, Swedish and more).

