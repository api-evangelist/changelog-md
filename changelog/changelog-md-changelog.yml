note: >-
  Keep a Changelog keeps its own changelog in the format it defines — the project's
  CHANGELOG.md is simultaneously the release history of the specification and the
  canonical worked example of the convention, and the spec page renders it inline as
  the example changelog. Read verbatim from the raw file on the main branch and
  cross-checked against the rendered spec page at https://keepachangelog.com/en/2.0.0/.

