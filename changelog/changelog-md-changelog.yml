  - version: 2.0.0
    date: '2026-06-07'
    url: https://keepachangelog.com/en/2.0.0/
    breaking: true
    summary: >-
      First major revision of Keep a Changelog. It breaks the guidance, not the format —
      the six change types, YYYY-MM-DD dates, and the Unreleased and [YANKED] markers are
      unchanged, so an existing changelog stays valid. What breaks is the surface around
      it: the page is restructured so some older section anchors no longer resolve, the
      recommended guidance has shifted, and existing translations lag until they catch up.
    breaking_changes:
      - Retired the tagline "Don't let your friends dump git logs into changelogs" for "Clearly document the evolution of your projects"; earlier versions keep the original.
      - Restructured the page from a flat FAQ into integrated guidance in a plainer, less first-person voice; some older section links no longer resolve.
      - Removed the FAQ scaffolding and most first-person framing, whose section anchors no longer resolve; the podcast note moved to the References section.
    highlights:
      - New format guidance — the '# Changelog' header preamble, adopting a newer version of the format without rewriting history, marking breaking changes and where upgrade steps belong, choosing between Changed/Fixed/Security, leading a Security entry with its CVE, and why the six change types do not grow.
      - New versioning guidance — schemes beyond SemVer, and linking each version to a compare diff with reference links.
      - New guidance on changelogs vs. release notes, including why a host's generated notes are vendor lock-in.
      - New automation guidance — LLM-drafted changelogs with a brief for an AGENTS.md, Conventional Commits, CI/CD, linking issues and pull requests, crediting contributors.
      - New guidance for scale — very large changelogs and monorepos.
      - Redesigned, accessible site (WCAG 2.1 AA) with light and dark themes.
      - Removed outdated specifics — the Vandamme gem reference and a GitHub-Releases discoverability note.
    counts:
      added: 3
      changed: 4
      removed: 2

  - version: 1.1.2
    date: '2024-09-27'
    breaking: false
    highlights:
      - Fifteen v1.1 translations added (German, Italian, Simplified Chinese, Persian, Polish, Slovenian, Traditional Chinese, Spanish, Brazilian Portuguese, Czech, Romanian, Swedish, Ukrainian, Korean, Indonesian).
      - French and Dutch translations improved.
    counts:
