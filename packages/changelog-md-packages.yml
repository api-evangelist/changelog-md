note: >-
  NO PACKAGE HERE IS FIRST-PARTY. Keep a Changelog publishes a specification, not
  software: the project states plainly in its own AGENTS.md that "we do not create or
  endorse specific tools", and the 2.0.0 release REMOVED the one tool reference the spec
  used to carry (the Vandamme gem). Every entry below is a third-party implementation of
  the format, recorded for currency evidence only. official is false on all of them, and
  no SDKs pointer is wired into apis.yml, because there is no first-party client library
  to point at.
