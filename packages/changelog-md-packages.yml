currency_finding: >-
  Of six current implementations, two shipped within the last three months and three have
  not been released since 2024 or earlier; none has been updated to reflect the 2.0.0
  guidance revision of 2026-06-07. Because the 2.0.0 release explicitly did NOT change
  the format — the six change types, the date format, Unreleased and [YANKED] are all
  unchanged — an older parser is not necessarily broken, which is the one case in this
  catalog where a stale package date is not by itself an abandonment signal.
